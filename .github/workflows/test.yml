# Self-test for this repository.
#
# This action is consumed by every WordPress project, so a bad merge here is a
# bad merge in all of them simultaneously. Consumers therefore pin a released
# tag rather than the default branch, and the gate's exit-code contract is
# asserted on every push.
name: test

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: compatibility gate self-test
        run: bash tests/run.sh

  # Same assertions, on the Synology runner. Proves the self-hosted path
  # actually executes rather than merely registering: a runner can sit online
  # and idle forever while jobs queue against a label nothing matches.
  gate-self-hosted:
    runs-on: [self-hosted, nexapulse]
    steps:
      - uses: actions/checkout@v4
      - name: compatibility gate self-test
        run: bash tests/run.sh
      - name: where did this run
        run: |
          echo "host: $(uname -srm)"
          echo "php : $(php -v | head -1)"
